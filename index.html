<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHU48 Official</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fff8fc;
    color: #333;
}

header {
    background: white;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    letter-spacing: 4px;
}

nav {
    margin-top: 15px;
}

nav a {
    margin: 0 8px;
    color: #555;
    text-decoration: none;
    font-size: 13px;
}

.hero {
    text-align: center;
    padding: 80px 20px;
    background: #f9ddea;
}

.hero h1 {
    font-size: 48px;
    margin: 0;
}

.hero p {
    font-size: 16px;
}

.button {
    display: inline-block;
    margin-top: 20px;
    padding: 13px 30px;
    border-radius: 30px;
    background: #333;
    color: white;
    text-decoration: none;
}

.section {
    max-width: 900px;
    margin: auto;
    padding: 50px 20px;
    text-align: center;
}

.cards {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    width: 250px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

footer {
    text-align: center;
    padding: 30px;
    color: #999;
}
</style>
</head>

<body>

<header>

    <div class="logo">
        CHU48
    </div>

    <nav>
        <a href="#">HOME</a>
        <a href="#">MEMBERS</a>
        <a href="#">SINGLES</a>
        <a href="#">NEWS</a>
        <a href="#">SCHEDULE</a>
    </nav>

</header>


<section class="hero">

    <h1>CHU48</h1>

    <p>
        Welcome to CHU48 Official Website
    </p>

    <a class="button" href="#">
        COOKIE RANKING 🍪
    </a>

</section>


<section class="section">

    <h2>NEWS</h2>

    <div class="cards">

        <div class="card">
            <h3>CHU48 NEWS</h3>
            <p>Latest news and announcements.</p>
        </div>

        <div class="card">
            <h3>NEW SINGLE</h3>
            <p>Coming soon ♡</p>
        </div>

        <div class="card">
            <h3>MEMBERS</h3>
            <p>Meet our members.</p>
        </div>

    </div>

</section>


<section class="section">

    <h2>🍪 COOKIE RANKING</h2>

    <p>
        ปาคุกกี้เพื่อสะสมคะแนนประจำสัปดาห์
    </p>

</section>


<footer>

    CHU48 OFFICIAL

</footer>

</body>
</html>
